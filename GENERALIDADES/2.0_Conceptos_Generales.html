<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página en Desarrollo - DSINET Manual de Usuario</title>
    
    <!-- Importación de Google Fonts para tipografía profesional y moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="../desarollo.css">
</head>
<body>

    <main class="container">
        <!-- Contenedor del Logo de DSINET -->
        <div class="logo-container">
            <!-- REEMPLAZA "logo.png" CON LA RUTA DE TU IMAGEN -->
            <img src="../Imagenes/DSI_NET_Logo.png" alt="DSINET Manual de Usuario" class="logo">
        </div>

        <!-- Etiqueta informativa de Estado -->
        <div class="status-badge">
            <span class="dot"></span>
            SITIO EN DESARROLLO
        </div>

        <!-- Mensaje Principal -->
        <h1>Estamos preparando algo grande para ti</h1>
        
        <p class="description">
            Nuestra plataforma digital y de manuales de usuario se encuentra en proceso de diseño y desarrollo para ofrecerte la mejor experiencia posible.
        </p>

        <!-- Detalle de Carga/Progreso Animado -->
        <div class="progress-visual">
            <span class="progress-icon" aria-hidden="true">⚙️</span>
            <div class="progress-line" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-line-fill"></div>
            </div>
            <span class="progress-icon" aria-hidden="true">🔧</span>
        </div>

        <!-- Pie de página con contacto formal -->
        <footer class="footer">
            <p class="footer-text">
                ¿Tienes alguna consulta urgente? <br> 
                Contáctanos en <a href="mailto:soporte@dsi-sac.com" class="contact-link">soporte@dsinet.com</a>
            </p>
        </footer>
    </main>

</body>
</html>
